<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crewlink - only v.i.p.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="client" id="local-client">
            <label>You</label>
            <video id="local" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <div class="controls-panel">
                <button id="micBtn" class="control-btn active" title="Микрофон">🎤</button>
                <button id="camBtn" class="control-btn active" title="Камера">📷</button>
                <button id="deafenBtn" class="control-btn" title="Оглушить">🎧</button>
                <button id="screenBtn" class="control-btn" title="Демонстрация">🖥</button>
                <button id="leaveBtn" class="control-btn leave" title="Отключиться">⛔</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
