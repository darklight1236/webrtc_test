<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crewlink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="lobby-body">

    <div class="lobby">
        <h1>Crewlink</h1>

        <input id="nameInput" class="name-input" placeholder="Введите имя..." />

        <button id="joinBtn" class="join-btn">
            Подключиться
        </button>
    </div>

    <script>
        document.getElementById("joinBtn").onclick = () => {
            const name = document.getElementById("nameInput").value.trim() || "Guest";
            window.location.href = `/chat.html?name=${encodeURIComponent(name)}`;
        };
</script>

</body>
</html>
